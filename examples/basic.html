<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aframe-nft example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=1"/>
    <link rel="stylesheet" href="css/nft-style.css"/>
    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="app">
    <video loop autoplay muted playsinline id="video"></video>
    <canvas id="canvas"></canvas>
</div>
<script src="../dist/AframeNft.js"></script>
<div class="example-container">
    <a-scene arnft="videoWidth: 1280; videoHeight: 720">

        <a-nft name="ping" url="examples/DataNFT/pinball">
            <!--<a-box  color="#4CC3D9"></a-box>-->
            <!--<a-box scale="120 120 120" color="#4CC3D9"></a-box>-->
            <a-box color="#4CC3D9"></a-box>
        </a-nft>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    </a-scene>
</div>
</body>
</html>
