name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # dist/AframeNft.js is committed: fail when a change to src/ was pushed
      # without rebuilding it.
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist/
